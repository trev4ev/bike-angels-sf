[project]
name = "bike-angels-sf"
version = "0.1.0"
description = "Collect Bay Wheels Bike Angels station points for algorithm reverse-engineering"
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.27",
  "rich>=13.0",
]

[project.scripts]
bike-angels = "bike_angels.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
