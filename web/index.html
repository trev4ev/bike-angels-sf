<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bike Angels SF Router</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="Plan Bay Wheels Bike Angels point routes from an address — stations, map, time, and predicted points."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="panel">
        <header class="brand">
          <h1>Bike Angels SF</h1>
          <p>
            Find a multi-stop rebalancing route from your address — predicted
            points, walk/ride time, and stations on the map.
          </p>
        </header>

        <p class="meta" id="data-meta">Loading live GBFS…</p>

        <form id="route-form">
          <label>
            Start address
            <input
              id="address"
              name="address"
              type="text"
              placeholder="e.g. 16th St Mission BART, San Francisco"
              autocomplete="street-address"
              required
            />
          </label>

          <label>
            <span class="row">
              <span>Time budget</span>
              <span id="minutes-label">45 min</span>
            </span>
            <input
              id="minutes"
              name="minutes"
              type="range"
              min="20"
              max="120"
              step="5"
              value="45"
            />
          </label>

          <label class="check">
            <input id="allow-ebike" type="checkbox" />
            Allow e-bike ($0.17/min)
          </label>

          <div class="actions">
            <button class="primary" type="submit">Find route</button>
            <button class="ghost" type="button" id="use-location">
              Use GPS
            </button>
          </div>
        </form>

        <p class="status" id="status" data-kind="info"></p>
        <div class="results" id="results" aria-live="polite"></div>
      </aside>

      <main class="map-shell" aria-label="Route map">
        <div id="map"></div>
      </main>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
